name: Build & Publish

on:
  push:
    tags:
      - "v*"
  # Manual run, for publishing a version that is already tagged (for example
  # the first npmjs release of a version GitHub Packages already has).
  workflow_dispatch:
    inputs:
      github_packages:
        description: "Also publish to GitHub Packages (fails if that version is already there)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  # Lets npm prove this workflow's identity, for trusted publishing and
  # --provenance.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11, which supports trusted publishing (>= 11.5.1).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@mentra-intelligence"
      - run: npm --version
      - run: npm install
      - run: npm run typecheck
      - run: npm test

      # Public registry: what tenants install from, no token needed to install.
      # Publishing uses npm trusted publishing: npmjs trusts this workflow file
      # in this repo via its OIDC identity (id-token: write), so no npm token is
      # stored anywhere. Renaming this file breaks that trust until the trusted
      # publisher entry on npmjs is updated to match.
      - run: npm publish --access public --provenance

      # GitHub Packages, kept for existing installs until they move to npmjs.
      - uses: actions/setup-node@v4
        if: github.event_name == 'push' || inputs.github_packages
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@mentra-intelligence"
      - run: npm publish --access public
        if: github.event_name == 'push' || inputs.github_packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
